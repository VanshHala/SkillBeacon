<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Worker Analysis Wizard | SkillBeacon</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1b2021",
                        "background-light": "#ffffff",
                        "background-muted": "#f8fafc",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "sans": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.75rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }</script>
<style>body {
            font-family: 'Lexend', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        input[type='range'] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type='range']::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
        }
        input[type='range']::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #1b2021;
            margin-top: -8px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }</style>
</head>
<body class="bg-white text-slate-900 min-h-screen">
<!-- Main Container -->
<div class="relative flex min-h-screen flex-col" id="final_analysis_wizard">
<!-- Top Navigation -->
<header class="sticky top-0 z-50 w-full border-b border-slate-100 bg-white/70 backdrop-blur-xl px-6 md:px-20 py-4 flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl">api</span>
<h2 class="text-lg font-bold tracking-tight text-primary">SkillBeacon</h2>
</div>
<div class="flex items-center gap-6">
<a class="text-sm font-medium text-slate-500 hover:text-primary transition-colors" href="#">Help Center</a>
<button class="size-9 rounded-full bg-slate-50 flex items-center justify-center border border-slate-200/50">
<span class="material-symbols-outlined text-slate-500 text-xl">person</span>
</button>
</div>
</header>
<!-- Content Area -->
<main class="flex-1 max-w-4xl mx-auto w-full px-6 py-12">
<!-- Progress Section -->
<div class="mb-12"><div class="flex flex-col gap-6">
<div class="flex justify-between items-end">
<div>
<span class="text-slate-400 font-medium text-xs tracking-[0.2em] uppercase mb-2 block">Step 02 / 03</span>
<h1 class="text-3xl font-semibold text-primary tracking-tight">Experience &amp; Skills</h1>
</div>
<span class="text-slate-400 text-sm font-medium">66% Complete</span>
</div>
<div class="w-full h-1 bg-slate-100 rounded-full">
<div class="h-full bg-primary transition-all duration-700 ease-out" style="width: 66%;"></div>
</div>
</div></div>
<!-- Form Container -->
<div class="space-y-10"><!-- Section 1: Job & Location -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
<div class="space-y-3">
<label class="text-xs font-semibold text-slate-500 uppercase tracking-wider ml-1">Current Job Title</label>
<input class="w-full px-5 py-4 bg-slate-50/50 border border-slate-200/60 rounded-xl focus:ring-2 focus:ring-primary/5 focus:border-primary/20 focus:bg-white transition-all outline-none placeholder:text-slate-400 text-sm" placeholder="e.g. Senior Product Designer" type="text"/>
</div>
<div class="space-y-3">
<label class="text-xs font-semibold text-slate-500 uppercase tracking-wider ml-1">Target City</label>
<input class="w-full px-5 py-4 bg-slate-50/50 border border-slate-200/60 rounded-xl focus:ring-2 focus:ring-primary/5 focus:border-primary/20 focus:bg-white transition-all outline-none placeholder:text-slate-400 text-sm" placeholder="e.g. Austin, TX" type="text"/>
</div>
</div>
<!-- Section 2: Experience -->
<div class="space-y-4 pt-4">
<div class="flex justify-between items-center">
<label class="text-xs font-semibold text-slate-500 uppercase tracking-wider ml-1">Total Years of Experience</label>
<span class="text-sm font-bold text-primary">8 Years</span>
</div>
<div class="px-1">
<input class="w-full" max="25" min="0" step="1" type="range" value="8"/>
</div>
</div>
<!-- Section 3: Skills -->
<div class="space-y-3">
<label class="text-xs font-semibold text-slate-500 uppercase tracking-wider ml-1">Technical Skills</label>
<div class="flex flex-wrap gap-2 p-4 bg-slate-50/50 border border-slate-200/60 rounded-xl min-h-[64px] items-center">
<span class="inline-flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-200 text-slate-700 rounded-lg text-xs font-semibold shadow-sm">
            Tailwind CSS <span class="material-symbols-outlined text-[14px] cursor-pointer hover:text-red-500">close</span>
</span>
<span class="inline-flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-200 text-slate-700 rounded-lg text-xs font-semibold shadow-sm">
            UI/UX Design <span class="material-symbols-outlined text-[14px] cursor-pointer hover:text-red-500">close</span>
</span>
<span class="inline-flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-200 text-slate-700 rounded-lg text-xs font-semibold shadow-sm">
            Data Analysis <span class="material-symbols-outlined text-[14px] cursor-pointer hover:text-red-500">close</span>
</span>
<input class="flex-1 min-w-[120px] border-none focus:ring-0 bg-transparent text-sm p-0 ml-2" placeholder="Add skill..." type="text"/>
</div>
</div>
<!-- Section 4: Description -->
<div class="space-y-3">
<div class="flex justify-between items-center">
<label class="text-xs font-semibold text-slate-500 uppercase tracking-wider ml-1">Professional Summary</label>
<button class="flex items-center gap-1.5 text-[11px] font-bold text-slate-600 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">auto_awesome</span>
            AI ENHANCE
        </button>
</div>
<textarea class="w-full px-5 py-4 bg-slate-50/50 border border-slate-200/60 rounded-xl focus:ring-2 focus:ring-primary/5 focus:border-primary/20 focus:bg-white transition-all outline-none placeholder:text-slate-400 text-sm resize-none" placeholder="Briefly describe your current responsibilities..." rows="5"></textarea>
</div>
<!-- Action -->
<div class="pt-8">
<button class="w-full py-5 bg-primary text-white rounded-xl text-sm font-bold tracking-[0.1em] hover:bg-slate-800 transition-all flex items-center justify-center gap-3 shadow-lg shadow-primary/10">
        GENERATE INTELLIGENCE REPORT
        <span class="material-symbols-outlined text-[18px]">north_east</span>
</button>
<p class="text-center text-slate-400 text-[11px] mt-6 tracking-wide">ESTIMATED ANALYSIS TIME: 30 SECONDS</p>
</div></div>
</main>
<!-- Footer -->
<footer class="mt-auto px-6 md:px-20 py-10 border-t border-slate-200 dark:border-slate-800 flex flex-col md:flex-row justify-between items-center gap-6"><p class="text-slate-400 text-xs">© 2024 SkillBeacon. Minimal Analysis Interface.</p>
<div class="flex gap-10 text-[11px] font-bold text-slate-500 uppercase tracking-widest">
<a class="hover:text-primary transition-colors" href="#">Privacy</a>
<a class="hover:text-primary transition-colors" href="#">Terms</a>
<a class="hover:text-primary transition-colors" href="#">Support</a>
</div></footer>
</div>
<!-- AI Chatbot FAB -->
<button class="fixed bottom-8 right-8 size-14 bg-white border border-slate-200 text-primary rounded-full shadow-xl flex items-center justify-center hover:scale-105 transition-transform z-[100]">
<span class="material-symbols-outlined text-2xl">chat_bubble</span>
</button>
</body></html>
