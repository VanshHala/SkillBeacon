<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillBeacon — Talent Intelligence Ecosystem</title>
  <meta name="description"
    content="A sophisticated ecosystem designed for elite professionals. Map, analyze, and accelerate your career trajectory with AI-driven clarity." />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
</head>

<body class="antialiased">
  <div id="root"></div>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      document.body.innerHTML = '<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:red;color:white;font-size:24px;padding:40px;z-index:9999;overflow:auto;"><h1 style="color:white;margin-bottom:20px;">FATAL BROWSER ERROR</h1><p><strong>Message:</strong> ' + message + '</p><pre style="background:#000;color:#0f0;padding:20px;overflow-x:auto;">' + (error && error.stack ? error.stack : 'No stack trace') + '</pre><p>Please copy this exact error and give it to the AI.</p></div>';
      return false; // let the default error handler run too
    };
    window.onunhandledrejection = function (event) {
      document.body.innerHTML = '<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:#800000;color:white;font-size:24px;padding:40px;z-index:9999;overflow:auto;"><h1 style="color:white;margin-bottom:20px;">UNHANDLED PROMISE REJECTION</h1><p><strong>Reason:</strong> ' + event.reason + '</p><pre style="background:#000;color:#0f0;padding:20px;overflow-x:auto;">' + (event.reason && event.reason.stack ? event.reason.stack : 'No stack trace') + '</pre><p>Please copy this exact error and give it to the AI.</p></div>';
    };
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
